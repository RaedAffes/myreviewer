# TEMPLATE — do not commit real values.
# Easiest is to create the real secret from your local back/.env (what
# scripts/vm-setup.sh does):
#   kubectl -n myreviewer create secret generic myreviewer-env \
#     --from-env-file=back/.env
# Or copy this file to myreviewer-env.yaml (gitignored) and fill it in.
apiVersion: v1
kind: Secret
metadata:
  name: myreviewer-env
type: Opaque
stringData:
  # LLM (NVIDIA NIM)
  NIM_API_KEY: "nvapi-replace-me"
  NIM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  NIM_MODEL: "nvidia/nemotron-3-super-120b-a12b"
  LLM_TEMPERATURE: "0.0"
  LLM_MAX_TOKENS: "8192"

  # GitHub OAuth ("Connect your GitHub")
  GITHUB_CLIENT_ID: "replace-me"
  GITHUB_CLIENT_SECRET: "replace-me"
  # Exactly one callback per OAuth App — this must match the OAuth App config:
  GITHUB_REDIRECT_URI: "https://myreviewer.tech/api/auth/callback"

  # GitHub API / webhook
  GITHUB_TOKEN: "ghp_replace-me"
  GITHUB_APP_ENABLED: "1"
  GITHUB_WEBHOOK_SECRET: "replace-me"
  GITHUB_BOT_USERNAME: "myreviewer[bot]"

  # App
  APP_URL: "https://myreviewer.tech"
