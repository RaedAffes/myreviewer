# Cloudflare Tunnel connector — outbound-only, gives the VM without a public
# IP access to myreviewer.tech. Cloudflare dashboard routes the public hostname
# to http://myreviewer-front.myreviewer.svc.cluster.local:80.
#
# The sysctl below lets cloudflared use ICMP for its edge health checks
# (official Cloudflare k8s guidance). k3s must be started with
#   --kubelet-arg=allowed-unsafe-sysctls=net.ipv4.ping_group_range
# (scripts/vm-setup.sh does this). If your cluster rejects the pod, delete the
# whole `securityContext.sysctls` block — the tunnel works without it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      priorityClassName: app-high
      securityContext:
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "0 2147483647"
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
# Metrics endpoint scraped by Prometheus (tunnel liveness).
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
spec:
  selector:
    app: cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: 2000
