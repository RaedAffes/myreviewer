name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push front
        uses: docker/build-push-action@v6
        with:
          context: .
          target: front
          push: true
          tags: |
            raedaffes/myreviewer:front-latest
            raedaffes/myreviewer:front-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            raedaffes/myreviewer:api-latest
            raedaffes/myreviewer:api-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push webhook
        uses: docker/build-push-action@v6
        with:
          context: .
          target: webhook
          push: true
          tags: |
            raedaffes/myreviewer:webhook-latest
            raedaffes/myreviewer:webhook-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64]
    env:
      # k3s' kubectl defaults to /etc/rancher/k3s/k3s.yaml (600 root:root), which
      # the runner user can't read. Point it at the user-readable home copy.
      KUBECONFIG: /home/myreviewer/.kube/config
    steps:
      - uses: actions/checkout@v4

      - name: Verify cluster access
        run: |
          set +e
          ok=0
          for i in $(seq 1 6); do
            if kubectl get nodes; then ok=1; break; fi
            echo "k3s API unreachable (attempt $i/6); retrying in 10s"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::k3s API still unreachable — attempting a non-interactive k3s restart"
            if sudo -n systemctl restart k3s 2>/dev/null; then
              echo "k3s restart issued; waiting for the API to come back"
              sleep 30
              for i in $(seq 1 12); do
                if kubectl get nodes; then ok=1; break; fi
                echo "waiting for k3s (attempt $i/12)"; sleep 10
              done
            else
              echo "::warning::no passwordless sudo for 'systemctl restart k3s' — cannot self-heal"
            fi
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::error::kubectl cannot reach the k3s cluster as user '$(id -un)' (KUBECONFIG=$KUBECONFIG)."
            echo "The VM is likely out of memory. On the VM: sudo systemctl restart k3s"
            echo "Permanent fix: raise VM RAM to 2 GB, or install scripts/k3s-watchdog.timer."
            exit 1
          fi

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -k k8s/

      # Monitoring stack disabled: the VM is memory-constrained and Prometheus +
      # Grafana starve k3s' datastore (kine), freezing the API. Re-enable by
      # restoring this step. See scripts/vm-setup.sh.
      # - name: Apply monitoring stack
      #   run: |
      #     if kubectl -n monitoring get secret grafana-admin >/dev/null 2>&1; then
      #       kubectl apply -k k8s/monitoring/
      #     else
      #       echo "grafana-admin secret missing (run scripts/vm-setup.sh first) — skipping monitoring"
      #     fi

      - name: Roll out back services (api + webhook)
        run: |
          kubectl -n myreviewer set image deploy/myreviewer-api api=raedaffes/myreviewer:api-${{ github.sha }}
          kubectl -n myreviewer set image deploy/myreviewer-webhook webhook=raedaffes/myreviewer:webhook-${{ github.sha }}
          kubectl -n myreviewer rollout restart deploy/myreviewer-api deploy/myreviewer-webhook
          kubectl -n myreviewer rollout status deploy/myreviewer-api --timeout=300s
          kubectl -n myreviewer rollout status deploy/myreviewer-webhook --timeout=300s
          for d in api webhook; do
            got=$(kubectl -n myreviewer get deploy "myreviewer-$d" -o jsonpath='{.spec.template.spec.containers[0].image}')
            want="raedaffes/myreviewer:$d-${{ github.sha }}"
            if [ "$got" != "$want" ]; then echo "::error::myreviewer-$d still on $got (wanted $want)"; exit 1; fi
          done

      - name: Roll out front
        run: |
          kubectl -n myreviewer set image deploy/myreviewer-front front=raedaffes/myreviewer:front-${{ github.sha }}
          kubectl -n myreviewer rollout restart deploy/myreviewer-front
          kubectl -n myreviewer rollout status deploy/myreviewer-front --timeout=300s
          got=$(kubectl -n myreviewer get deploy myreviewer-front -o jsonpath='{.spec.template.spec.containers[0].image}')
          want="raedaffes/myreviewer:front-${{ github.sha }}"
          if [ "$got" != "$want" ]; then echo "::error::myreviewer-front still on $got (wanted $want)"; exit 1; fi
